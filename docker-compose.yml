version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: devpulse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devpulse_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
