name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.14.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm --filter backend test
        env:
          NODE_ENV: test
          POSTGRES_USER: devpulse_user
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: devpulse_db
          DATABASE_URL: 'postgresql://devpulse_user:supersecretpassword@localhost:5432/devpulse_db?schema=public'
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: 'super-secret-test-jwt-secret-min-32-chars-long-123456789'
          JWT_EXPIRES_IN: 7d
          DEVPULSE_API_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
          RESEND_API_KEY: re_test123
          EMAIL_FROM: onboarding@resend.dev
          OPENAI_API_KEY: sk-test-123
